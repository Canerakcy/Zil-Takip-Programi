name: Android APK Derle

on:
  push:
    branches: ["**"]
    tags: ["android-v*"]
    paths:
      - "zil_takip_android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zil_takip_android
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # Flutter 3.35+ minSdk tabanını 24'e (Android 7.0) çıkardı; hedef
      # cihazımız Android 6.0.1 (API 23) olduğu için minSdk 21'i hâlâ
      # destekleyen son kararlı sürüm olan 3.32.8'e bilinçli olarak
      # sabitlendi. Yükseltmeden önce hedef cihazın Android sürümünü
      # kontrol edin.
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: "stable"
          cache: true

      - name: Bağımlılıkları kur
        run: flutter pub get

      - name: Statik analiz
        run: flutter analyze

      - name: Testleri çalıştır
        run: flutter test

      - name: Sürüm numarası oluştur
        id: version
        shell: bash
        run: echo "tag=android-v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: APK oluştur (release)
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: APK'yı adlandır
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CeselsanZilTakip.apk

      - name: APK'yı yükle (Actions Artifacts)
        uses: actions/upload-artifact@v6
        with:
          name: CeselsanZilTakip-android-apk
          path: zil_takip_android/build/app/outputs/flutter-apk/CeselsanZilTakip.apk
          if-no-files-found: error

      - name: GitHub Release oluştur (her derleme yeni bir sürüm)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Ceselsan Zil Takip Android ${{ steps.version.outputs.tag }}"
          make_latest: false
          files: zil_takip_android/build/app/outputs/flutter-apk/CeselsanZilTakip.apk

      # exe'deki "releases/latest/download/..." linkiyle aynı deneyimi
      # Android için de sağlamak üzere, sabit "android-latest" etiketli bir
      # release her derlemede güncellenir - böylece README'deki link hiç
      # değişmeden her zaman en güncel APK'yı verir. Windows exe'nin
      # "gerçek" latest release bayrağını (make_latest: true) elinde
      # tutmasını bozmamak için bu release'de make_latest kullanılmaz.
      - name: "Sabit \"en güncel\" indirme linkini güncelle"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Ceselsan Zil Takip Android - En Güncel Sürüm"
          make_latest: false
          files: zil_takip_android/build/app/outputs/flutter-apk/CeselsanZilTakip.apk
