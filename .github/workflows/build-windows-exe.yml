name: Windows EXE Derle

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "zil_takip/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zil_takip
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      # Python 3.8, resmi olarak Windows 7'yi destekleyen SON Python
      # sürümüdür (3.9'dan itibaren Windows 8.1+ zorunlu kılınmıştır).
      # PyInstaller, uygulamayı bu sürümün Python çalışma zamanıyla birlikte
      # paketlediği için, üretilen .exe'nin Windows 7'de açılabilmesi için
      # burada 3.8 kullanılması ŞARTTIR - daha yeni bir sürüm kullanılırsa
      # exe Windows 7'de hiç başlamaz.
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sürüm numarası oluştur
        id: version
        shell: bash
        run: echo "tag=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Sürüm bilgisini exe'ye göm (version_info.txt)
        shell: bash
        run: |
          sed -i "s/filevers=(1, 0, 0, 0)/filevers=(1, 0, ${{ github.run_number }}, 0)/" version_info.txt
          sed -i "s/prodvers=(1, 0, 0, 0)/prodvers=(1, 0, ${{ github.run_number }}, 0)/" version_info.txt
          sed -i "s/FileVersion', '1.0.0.0'/FileVersion', '1.0.${{ github.run_number }}.0'/" version_info.txt
          sed -i "s/ProductVersion', '1.0.0.0'/ProductVersion', '1.0.${{ github.run_number }}.0'/" version_info.txt

      - name: EXE oluştur (PyInstaller)
        run: pyinstaller zil_takip.spec --noconfirm --clean

      - name: EXE'yi yükle (Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: CeselsanZilTakip-windows-exe
          path: zil_takip/dist/CeselsanZilTakip.exe
          if-no-files-found: error

      - name: GitHub Release oluştur (her derleme yeni bir sürüm)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Ceselsan Zil Takip Programı ${{ steps.version.outputs.tag }}"
          make_latest: true
          files: zil_takip/dist/CeselsanZilTakip.exe
